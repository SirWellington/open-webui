# SearXNG configuration for the OpenWebUI web-search instance
# Docs: https://docs.searxng.org/admin/settings/
#
# Engine pool notes:
# - `inactive: false` is required on `google` — the image default marks it inactive
# - `brave` = free scraper fallback (no quota); 429-blocks in bursts but is the
#   best free engine, so it carries the highest free-pool weight
# - `braveapi` = official Brave Search API (1000 req/mo quota); currently DISABLED to
#   preserve quota until better caching is in place (see "kept off" below)
# - `tavily` = official Tavily Search API (reliable, not IP-blocked); the primary
#   result source. Custom engine lives in searxng-engines/tavily.py (mounted into
#   the container). Highest weight so its results lead the merged output.
# - engines listed under "kept off" are loaded but excluded from the pool
#
# NOTE: this file is a template. Current SearXNG no longer supports the legacy
# `!process "env:..."` YAML tag, so the two secret values are `__PLACEHOLDERS__`
# that the searxng service's `entrypoint` override (docker-compose.custom.yaml)
# expands from the SEARXNG_SECRET / SEARXNG_BRAVE_API_KEY env vars at container
# start into /run/searxng/settings.yml (loaded via SEARXNG_SETTINGS_PATH).
# Keep real secrets out of this file (it is tracked by git).

use_default_settings: true

server:
  secret_key: "__SEARXNG_SECRET__"
  image_proxy: true
  method: "GET"
  limiter: false

search:
  proxy: false
  default_lang: "en"
  safe_search: 0
  # Disable autocomplete to save resources and avoid sending queries to search engines.
  autocomplete: ""
  formats:
    - html
    - json
  enabled_settings:
    - language
    - safe_search
    - time_range
    - weight
  # This IP gets 429/403-banned by brave/google/mojeek in waves; hold the
  # suspension longer (10min vs 3min) instead of re-hammering dead engines
  # on every query (defaults: 180s)
  suspended_times:
    SearxEngineTooManyRequests: 600
    SearxEngineAccessDenied: 600

outgoing:
  # 3.0s/5.0s were dropping slow engines (brave/yahoo) mid-request; 7.0s keeps
  # the flaky-but-alive engines in the pool
  request_timeout: 7.0

engines:
  # --- core pool (active) ---
  # Tavily = reliable paid API (not IP-blocked). Highest weight so its ranked
  # results dominate over the flaky/blocked free-pool scrapers. 1 credit/search.
  - name: tavily
    engine: tavily
    api_key: "__SEARXNG_TAVILY_API_KEY__"
    max_results: 10
    weight: 10.0

  - name: google cse
    weight: 5.0

  - name: google
    inactive: false
    weight: 4.0

  - name: duckduckgo
    weight: 3.0

  - name: brave
    weight: 3.0

  - name: wikipedia
    weight: 2.0

  - name: yahoo
    disabled: false
    # low quality + weak phrase/boolean handling; only fills in when better
    # engines are blocked
    weight: 0.5

  # --- kept off (CAPTCHA/blocked/noisy) ---
  - name: braveapi
    disabled: true
    api_key: "__SEARXNG_BRAVE_API_KEY__"

  - name: mojeek
    disabled: true

  - name: bing
    disabled: true

  - name: qwant
    disabled: true

  - name: startpage
    disabled: true

plugins:
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: true
