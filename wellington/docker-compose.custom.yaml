services:
  open-webui:
    image: open-webui
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://host.docker.internal:1234/v1
      - WEB_LOADER_ENGINE=safe_web
      - PLAYWRIGHT_TIMEOUT=60000
      - WHISPER_MODEL=base
      - SESSION_SECRET=${SESSION_SECRET}
      - DO_NOT_TRACK=true
      # Points OpenWebUI to the internal Docling service
      - DOCLING_API_URL=http://docling-server:5001/v1/convert
      - DOCLING_API_KEY=${DOCLING_API_KEY}
      - ENABLE_SEARCH_WEB_TOOL=true
      - EXTERNAL_WEB_LOADER_URL=http://crawl4ai:11235/crawl
      - EXTERNAL_WEB_LOADER_API_KEY=${CRAWL4AI_API_KEY}
      - CRAWL4AI_API_KEY=${CRAWL4AI_API_KEY}
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 8G
    restart: always
    # GPU support:
    # Linux NVIDIA: add `runtime: nvidia` and install nvidia-container-toolkit
    # Docker Desktop: GPUs auto-exposed; no extra config needed


  # Docling Document Parser Service
  docling-server:
    image: hwdsl2/docling-server:latest
    container_name: docling-server
    restart: always
    environment:
      # Limits CPU threads to prevent it from starving your LLM
      - OMP_NUM_THREADS=4
      - DOCLING_API_KEY=${DOCLING_API_KEY}
    mem_limit: 2G 
    ports:
      - "3001:5001"

  # Crawl4AI Web Crawler Service
  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: always
    mem_limit: 4G
    environment:
      - GUNICORN_BIND=0.0.0.0:11235
      - CRAWL4AI_API_TOKEN=${CRAWL4AI_API_KEY}
      # LLM content filter (md f:llm) -> local LM Studio on the Docker host
      - LLM_PROVIDER=openai/qwen/qwen3.8-27b
      - OPENAI_BASE_URL=http://host.docker.internal:1234/v1
      - OPENAI_API_KEY=lm-studio
      - LLM_TEMPERATURE=0.1
      # Qwen3.8 thinking control, injected by the c4ai_llm_thinking.py hook (low = faster f:llm; none = off)
      - LLM_REASONING_EFFORT=low
    volumes:
      # Additive runtime hook: feeds LLM_REASONING_EFFORT into the LLM filter's extra_args (see tools/c4ai-llm-patch)
      - ./tools/c4ai-llm-patch/c4ai_llm_thinking.py:/usr/local/lib/python3.12/site-packages/c4ai_llm_thinking.py:ro
      - ./tools/c4ai-llm-patch/zz_c4ai_llm.pth:/usr/local/lib/python3.12/site-packages/zz_c4ai_llm.pth:ro
    ports:
      - "11235:11235"

  # SearXNG Metasearch Engine (JSON API for OpenWebUI web search)
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: always
    mem_limit: 1G
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_BRAVE_API_KEY=${SEARXNG_BRAVE_API_KEY}
      # SearXNG loads its user settings from this file (the expanded template).
      - SEARXNG_SETTINGS_PATH=/run/searxng/settings.yml
    ports:
      - "8081:8080"
    # Current SearXNG no longer supports the legacy `!process "env:..."` YAML tag
    # (container used to crash-loop with: "could not determine a constructor for
    # the tag '!process'"). Expand the two secret placeholders in the tracked
    # settings.yml template from the env vars at start into a container-local
    # file (never written back to the host), then exec the image's entrypoint.
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /run/searxng
        sed -e "s/__SEARXNG_SECRET__/${SEARXNG_SECRET}/g" \
            -e "s/__SEARXNG_BRAVE_API_KEY__/${SEARXNG_BRAVE_API_KEY}/g" \
            /etc/searxng/settings.yml > /run/searxng/settings.yml
        [ -s /run/searxng/settings.yml ] || { echo "ERROR: generated settings.yml is empty" >&2; exit 1; }
        exec /usr/local/searxng/entrypoint.sh
    volumes:
      - ./searxng-config/:/etc/searxng/:Z
      - searxng-core-data:/var/cache/searxng/

  # SearXNG MCP Server (ihor-sokoliuk/mcp-searxng): streamable HTTP on :3000/mcp
  # Only searxng_web_search is exposed (other tools disabled in mcpo.json).
  searxng-mcp:
    image: isokoliuk/mcp-searxng:latest
    container_name: searxng-mcp
    restart: always
    mem_limit: 512M
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - searxng
    environment:
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=3000
      - MCP_HTTP_STATELESS=true
      - SEARXNG_URL=http://searxng:8080
      - SEARXNG_MAX_RESULTS=10

  # mcpo: MCP -> OpenAPI bridge (searxng + crawl4ai MCP servers -> REST/OpenAPI for OpenWebUI)
  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    restart: always
    depends_on:
      - crawl4ai
      - searxng-mcp
    volumes:
      - ./mcpo.json:/app/mcpo.json
    command:
      - --port
      - "8000"
      - --api-key
      - ${MCPO_API_KEY}
      - --config
      - /app/mcpo.json
      - --hot-reload
    ports:
      - "127.0.0.1:8085:8000"

volumes:
  open-webui:
    external: true
  searxng-core-data: